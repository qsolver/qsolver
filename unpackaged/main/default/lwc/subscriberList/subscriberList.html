<template>
    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
        <div class="slds-col slds-grow">
            <h4 class="slds-text-title_caps">Subscribers ({subscriberCount})</h4>
        </div>
        <div class="slds-col slds-no-flex">
            <lightning-button
                label="Add Subscriber"
                variant="brand-outline"
                icon-name="utility:add"
                onclick={handleAddClick}
            ></lightning-button>
        </div>
    </div>

    <template if:true={hasSubscribers}>
        <div class="subscriber-table">
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col" class="slds-text-title_caps">Name</th>
                        <th scope="col" class="slds-text-title_caps">Email</th>
                        <th scope="col" class="slds-text-title_caps">Type</th>
                        <th scope="col" class="slds-text-title_caps" style="width: 80px;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={formattedSubscribers} for:item="sub">
                        <tr key={sub.Id} class="subscriber-row">
                            <td>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <lightning-icon
                                        icon-name={sub.icon}
                                        size="x-small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    <span>{sub.displayName}</span>
                                </div>
                            </td>
                            <td>{sub.displayEmail}</td>
                            <td>
                                <lightning-badge label={sub.Subscriber_Type__c} class={sub.badgeClass}></lightning-badge>
                            </td>
                            <td>
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    variant="bare"
                                    alternative-text="Remove"
                                    data-id={sub.Id}
                                    onclick={handleRemoveClick}
                                    class="remove-btn"
                                ></lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>

    <template if:false={hasSubscribers}>
        <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
            <p>No subscribers yet. Click "Add Subscriber" to get started.</p>
        </div>
    </template>
</template>
