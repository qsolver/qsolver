<template>

  <lightning-card style="color:#0176D3;" title="Oportunidades de Grinding Media">

    <div class="slds-scrollable">

      <div class="slds-card__header">
        <div class="slds-grid slds-grid_align-start slds-wrap slds-m-bottom_large"> 
          <lightning-button-icon class="slds-m-top_large"  icon-name="utility:refresh"  variant="brand" alternative-text="Refresh" onclick={refreshData}></lightning-button-icon>
        
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-5 slds-p-horizontal_small">
            <lightning-combobox name="Usuario" label="Usuario" value={currentUserId} placeholder="Selecciona el Usuario"
              options={userOptions} onchange={handleUserChange}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-5 slds-p-horizontal_small">
            <lightning-combobox name="Equipo de Ventas" label="Equipo de Venta" value={salesTeam}
              placeholder="Equipo de Venta" options={salesTeamOptions} onchange={handleSalesTeamChange}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-5 slds-p-horizontal_small">
            <lightning-combobox name="Año" label="Año" value={selectedYear} placeholder="Selecciona el año"
              options={yearOptions} onchange={yearHandleChange}>
            </lightning-combobox>
          </div>
          <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-5 slds-p-horizontal_small">
            <lightning-input type="search" name="accountSearch" label="Buscar por nombre de cuenta" value={accountSearchQuery}
              placeholder="Ingresa el nombre de la cuenta" onchange={handleAccountSearchChange}>
            </lightning-input>
          </div>
        </div>
      </div>
      


    <div style="height: 600px;">

        <template if:false={weekTemplate}>

          <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered"
            aria-labelledby="element-with-table-label other-element-with-table-label">
            <thead>
              <tr class="slds-line-height_reset">
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Opportunity Name">Opportunidad</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Opportunity Name">Cuenta</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Opportunity Name">Status</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Opportunity Name">Opp Type</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Enero">Enero</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Febrero">Febrero</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Marzo">Marzo</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Abril">Abril</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Mayo">Mayo</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Junio">Junio</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Julio">Julio</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Agosto">Agosto</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Septiembre">Septiembre</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Octubre">Octubre</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Noviembre">Noviembre</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Diciembre">Diciembre</div>
                </th>
                <th class="" style="position: sticky;top: 0;background-color: white;z-index: 2;border-bottom: 2px solid #d8dde6;" scope="col">
                  <div class="slds-truncate" title="Diciembre">Total</div>
                </th>
              </tr>
            </thead>
            <tbody>
              <template for:each={filteredOpportunityRecords} for:item="record">
                <tr key={record.opportunityId} class="slds-hint-parent">
                  <th data-label="Opportunity Name" scope="row">
                    
                    <div class="slds-truncate" title={record.opportunityName}><strong style="color:black;">
                      <lightning-formatted-url 
                      value={record.oppURL} 
                      label={record.opportunityName} 
                      target="_blank">
                  </lightning-formatted-url>
                  </strong></div>
                  </th>
                  <th data-label="Account Name" scope="row">
                    <div class="slds-truncate" title={record.oppAccountName}><strong style="color:black;">{record.oppAccountName}</strong></div>
                  </th>
                  <th data-label="Opportunity Stage" scope="row">
                    <div class="slds-truncate" title={record.oppStage}><strong style="color:black;">{record.oppStage}</strong></div>
                  </th>
                  <th data-label="Opportunity Type" scope="row">
                    <div class="slds-truncate" title={record.oppType}><strong style="color:black;">{record.oppType}</strong></div>
                  </th>
                  <template for:each={record.months} for:item="month" for:index="index">
                    <td key={month.id} data-label={index}>
                      <div class="slds-truncate" title={month.amount} style="color: green;">
                        {month.currencyISOCode}{month.amount}
                      </div>
                    </td>
                  </template>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title={record.oppTotalAmount}><strong style="color: green;">{record.oppCurrencyISOCode}{record.oppTotalAmount}</strong></div>
                  </th>
                </tr>
            
                <tr key={record.opportunityId} class="slds-hint-parent">
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons">Total Tons</div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons">Total Tons</div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons">Total Tons</div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons">Total Tons</div>
                  </th>
                  <template for:each={record.months} for:item="month" for:index="index">
                    <td key={month.id} data-label={index}>
                      <div class="slds-truncate" title={month.tons} style="color: #0176D3;">
                        {month.tons}
                      </div>
                    </td>
                  </template>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title={record.oppTons}>{record.oppTons}</div>
                  </th>
                </tr>
            
                <tr key={record.opportunityId} class="slds-hint-parent" style="background-color: #b2bec3;">
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons"></div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons"></div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons"></div>
                  </th>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons"></div>
                  </th>
                  <template for:each={record.months} for:item="month" for:index="index">
                    <td key={month.id} data-label={index}>
                      <div class="slds-truncate" title={month.tons}>
                      
                      </div>
                    </td>
                  </template>
                  <th data-label="Opportunity Name" scope="row">
                    <div class="slds-truncate" title="Total Tons"></div>
                  </th>
                </tr>
            
              </template>
            </tbody>
          </table>
        </template>
      </div>
      
      </div>

  </lightning-card>

</template>
