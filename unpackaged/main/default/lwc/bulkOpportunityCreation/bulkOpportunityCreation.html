<template>

    <template if:false={useModal}>
        <div style="background-color:white;">
        <lightning-layout>
            <!-- <div  class="slds-m-left_small slds-m-top_xxx-small slds-m-bottom_small" style="background-color:white;"> -->
            <lightning-layout-item padding="around-small">
                <lightning-button label="Bulk Opportunity Creation" variant="brand"  title="Bulk Opportunity Creation" onclick={handleBulkOpportunityCreation}></lightning-button>
            </lightning-layout-item>
            <!-- </div> -->
        </lightning-layout>
        </div>
    </template>

    <template if:true={useModal}>  
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open  slds-backdrop slds-modal_large" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <!-- <div class="slds-modal slds-fade-in-open slds-backdrop slds-modal_large">   -->
            <div class="slds-modal__container">  

                <!-- Header Section -->  
                <div class="slds-modal__header">  
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" size="large" variant="bare-inverse" onclick={closeModal} class="slds-modal__close"></lightning-button-icon>  
                <h2>Bulk Opportunity Creation</h2>  
                </div>  
                <!-- Header Section -->


                <!-- Body Section -->  
                <div class="slds-modal__content slds-p-around_medium">  
                    
                    <template if:true={showSpinner}>
                        <!-- <div class="slds-is-relative">   -->
                            <lightning-spinner alternative-text="Loading"></lightning-spinner>
                        <!-- </div> -->
                    </template>

                    <template if:true={Account}>
                        
                            Account: <strong>{Account.Name}</strong>
                            <br>
                            <br>
                            <div style="width:100%; display: flex">
                                <div class="slds-box slds-m-right--medium" style="width:50%;">
                                    <div>
                                        <h2 style="font-weight: bold;">Locate Opportunities</h2>
                                        <lightning-combobox
                                            name="oy"
                                            label="Ship Date"
                                            value={opportunityyear}
                                            placeholder={opportunityyear}
                                            options={opportunityyears}
                                            onchange={handleOpportunityYearChange} ></lightning-combobox>
                                    </div>
                                </div>
                                
                                <div class="slds-box" style="width:50%;">
                                    <div>
                                        <h2 style="font-weight: bold;">New Settings</h2>
                                        <div style="width:100%; display: flex">
                                            <div class="slds-m-right--medium" style="width:50%;">
                                                <lightning-input label="Ship Date" data-id="dateShipDate" value={shipdate} type="date" name="shipdateid" onchange={handleChange}></lightning-input>
                                            </div>
                                            <div style="width:50%;">
                                                <br>
                                                <lightning-input data-id="checkboxShipDate" value={shipdateaddyear} type="checkbox" label="Add a Year to existing value" name="shipdateaddyear" onchange={handleChange}></lightning-input>
                                            </div>
                                        </div>

                                        <div style="width:100%; display: flex">
                                            <div class="slds-m-right--medium" style="width:50%;">
                                                <lightning-input label="Close Date" data-id="dateCloseDate" value={closedate} type="date" name="closedateid" onchange={handleChange}></lightning-input>
                                            </div>
                                            <div style="width:50%;">
                                                <br>
                                                <lightning-input data-id="checkboxCloseDate" value={closedateaddyear} type="checkbox" label="Add a Year to existing value" name="closedateaddyear" onchange={handleChange}></lightning-input>
                                            </div>
                                        </div>
                                        <div style="width:100%; display: flex">
                                            <div class="slds-m-right--medium" style="width:50%;">
                                                <lightning-combobox label="Stage Name" data-id="textProgress" name="progress" value={stagename} options={stagenames} onchange={handleChange}></lightning-combobox> 
                                            </div>
                                            <div style="width:50%;">
                                                <br>
                                            </div>
                                        </div>
                                        
                                    </div>
                                </div>
                            </div>
                        <br>
                    </template>

                <template if:true={opportunitiesExist}>
                    <div class="slds-box">
                        <div style="height: 300px;">
                            <lightning-datatable 
                                data-id="opptable"
                                data-field="opptable" 
                                key-field="Id"
                                data={Opportunities}
                                errors={Errors}
                                columns={oColumns}>
                            </lightning-datatable>
                        </div>
                    </div>

                </template>
                
                <template if:false={opportunitiesExist}>
                    <div class="slds-box">
                        <div style="height: 300px;">
                            No Opportunities exist.
                        </div>
                    </div>
                </template>

                

                <template if:true={error}>
                    <div class="slds-m-top_small">
                        <span style="color:darkred">{error}</span>
                    </div>
                </template>

                <template if:true={message}>
                    <div class="slds-m-top_small " style="width:100%;">
                        <span class="slds-align_absolute-center" style="width:100%; color:darkgreen"><strong>{message}</strong></span>
                    </div>
                </template>

                </div>  
                <!-- Body Section --> 


                <!-- Footer Section -->  
                <div class="slds-modal__footer">  

                    <template if:true={opportunitiesExist}>
                        
                        <template if:true={disableBulkCreateButton}>
                            <lightning-button class="slds-p-right_small" label="Bulk Create" variant="brand" disabled></lightning-button>
                        </template>
                        <template if:false={disableBulkCreateButton}>
                            <lightning-button class="slds-p-right_small" label="Bulk Create" variant="brand" onclick={handleBulkCreate}></lightning-button>
                        </template>
                        
                    </template>
                    
                    <lightning-button name="cloneButton" label="Close" variant="brand" onclick={closeModal}></lightning-button>  

                </div>  
                <!-- Footer Section --> 

            </div>  
            <!-- </div>   -->
        </section>
      </template>  

</template>
