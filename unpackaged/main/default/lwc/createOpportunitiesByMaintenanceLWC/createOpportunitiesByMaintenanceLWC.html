<template>
  <div class="slds-card" style="height: unset;">
      <div class="slds-card__header slds-grid slds-p-vertical_none">
          <header class="slds-media slds-media_center slds-has-flexi-truncate">
              <!-- Card's Tittle -->
              <div class="slds-media__body">
                  <h2 class="slds-card__header-title">
                      <lightning-icon icon-name="custom:custom19" size="small" variant="circle" alternative-text="Assets"></lightning-icon>
                      <span class="slds-card__header-link slds-truncate slds-var-p-horizontal_small">
                          <span>Relate Opportunities by Maintenance</span>
                      </span>
                  </h2>
              </div>
              <div class="slds-no-flex">
                  <lightning-button variant="brand" label="Save" onclick={createRegisters}>
                  </lightning-button>
              </div>
          </header>
      </div>
      <h3 class="slds-section__title slds-theme_shade slds-var-m-horizontal_xx-small">
          <p style="padding-left: 10px;">Information</p>
      </h3>
      <!-- Card's Input Fields -->
      <lightning-record-edit-form object-api-name="Opportunity_by_Maintenance__c">
          <div class="slds-grid slds-wrap">
              <div class="slds-col slds-size_2-of-2">
                  <lightning-input-field field-name="Maintenance__c" value={maintenanceId}>
                  </lightning-input-field>
              </div>
              <!-- Custom Lookup multiselect -->
              <div class="slds-col slds-size_2-of-2">
                  <div class="slds-form-element slds-m-horizontal_xx-small">
                      <div class="slds-form-element__control">
                          <div class="slds-combobox_container">
                              <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" data-id="resultBox" aria-expanded="false" aria-haspopup="listbox" role="combobox">
                                  <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left-right slds-input-has-icon_group-right slds-p-horizontal_none">
                                      <lightning-input type="search" label="Opportunities" placeholder="Search Opportunities..." is-loading={LoadingText} onchange={searchField} required></lightning-input>
                                  </div>
                                  <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon slds-input-has-icon_left-right" role="none">
                                      <template for:each={selectedRecords} for:item="serecord">
                                          <span key={serecord.Id}>
                                          <lightning-pill label={serecord.Name} name={serecord.Id} onremove={removeRecord}>
                                                  <lightning-icon icon-name="standard:opportunity" variant="circle" alternative-text={serecord.Name}></lightning-icon>
                                              </lightning-pill>
                                          </span>
                                      </template>
                                  </div>

                                  <!--Display Search result-->
                                  <div class="slds-scrollable_y" style="height:200px;">
                                      <div class="slds-combobox  slds-dropdown-trigger slds-dropdown-trigger_click vk-scrollbar" role="combobox">
                                          <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                                              <template for:each={searchRecords} for:item="serecord">
                                                  <li role="presentation" class="slds-listbox__item" key={serecord.Id}>
                                                      <!-- PRUEBA -->
                                                      <div data-id={serecord.Id} data-name={serecord.Name} class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option" onclick={setSelectedRecord}>
                                                          <span class="slds-media__figure slds-listbox__option-icon">
                                                              <span class="slds-icon_container">
                                                                  <lightning-icon icon-name="standard:opportunity" size="x-small" class="slds-icon-text-default"></lightning-icon>
                                                              </span>
                                                          </span>
                                                          <span class="slds-media__body">
                                                              <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                                                                  {serecord.Name}
                                                              </span>
                                                              <span class="slds-listbox__option-text slds-listbox__option-text_entity" style="color:rgba(187, 181, 181, 0.986);">
                                                                {serecord.Opportunity_Number__c}
                                                              </span>
                                                          </span>
                                                      </div>

                                                  </li>
                                              </template>
                                          </ul>
                                      </div>
                                      <div if:true={messageFlag}>
                                          No result found.
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </lightning-record-edit-form>
  </div>

</template>
