<template>
    <!-- lightning button for open modal window -->
    <lightning-button variant="brand"
        label="Change Sales Rep"
        title="Change Sales Rep"
        onclick={openModal}
        icon-name="utility:change_owner"
        class="slds-button slds-button_neutral slds-button_full-width">       
    </lightning-button>
    
    <!--Use template if:true to display/hide popup based on isModalOpen value-->
    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <lightning-button class="slds-modal__close" icon-name="utility:close" variant="bare" onclick={closeModal}></lightning-button>
                    <lightning-modal-header label="Change Sales Rep - Modal"></lightning-modal-header>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-edit-form record-id={recordId} object-api-name="Account">
                        <div class="slds-p-top_medium">
                            <lightning-combobox
                                label="Line of Business"
                                placeholder="Select an option"
                                options={options}
                                value={selectedValues}
                                onchange={handlePicklistChange}
                                multiple>
                            </lightning-combobox>
                        </div>
                        <div class="slds-p-top_medium">
                                New Sales Rep
                        </div>
                        <div class="slds-p-top_medium">
                            <lightning-input-field field-name="ELM_OtherSalesRep__c"
                                                    variant="label-hidden"
                                                    onchange={handleUserChange}
                                                    value={salesrepsel}
                                                    required>
                            </lightning-input-field>
                        </div>
                        <div class="slds-p-top_medium">
                            <lightning-input
                            type="checkbox"
                            label="Transfer Open Opportunities"
                            onchange={handleOpenOppsChange}
                        >
                        </lightning-input>
                        <lightning-input
                            type="checkbox" 
                            label="Transfer Closed Opportunities"
                            onchange={handleClosedOppsChange}
                        >
                        </lightning-input>
                        <lightning-input
                            type="checkbox" 
                            label="Transfer Open Tasks"
                            onchange={handleOpenTasksChange}
                        >
                        </lightning-input>
                        <lightning-input
                            type="checkbox" 
                            label="Transfer Closed Tasks"
                            onchange={handleClosedTasksChange}
                        >
                        </lightning-input>
                        </div>
                    </lightning-record-edit-form>
                
                <!-- <lightning-input label="Buscar usuario" name="buscar-usuario" onchange={handleInputChange}></lightning-input> -->
                </div>
                
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={submitDetails} title="OK" disabled={saveStatus}>Save</button>
                </footer>
                <template if:true={isSaving}>
                    <div class="slds-spinner_container">
                        <div role="status" class="slds-spinner slds-spinner_medium">
                            <span class="slds-assistive-text">Guardando...</span>
                            <div class="slds-spinner__dot-a"></div>
                            <div class="slds-spinner__dot-b"></div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
 </template>
