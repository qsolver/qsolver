<template>

    <template if:false={useModal}>
        <div style="background-color:white;">
            <lightning-layout>
                <lightning-layout-item padding="around-small">
                    <lightning-button label="Send Trip Report" variant="brand"  title="Send Trip Report" onclick={handlePreSend}></lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </div>
    </template>


    <template if:true={useModal}>  
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open  slds-backdrop slds-modal_small" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <!-- <div class="slds-modal slds-fade-in-open slds-backdrop slds-modal_large">   -->
            <div class="slds-modal__container">  

                <!-- Header Section -->  
                <div class="slds-modal__header">  
                <lightning-button-icon icon-name="utility:close" alternative-text="Close" size="large" variant="bare-inverse" onclick={closeModal} class="slds-modal__close"></lightning-button-icon>  
                <h2>Trip Report</h2>  
                </div>  
                <!-- Header Section -->


                <!-- Body Section -->  
                <div class="slds-modal__content slds-p-around_medium">  
                    
                    <template if:true={showSpinner}>
                            <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </template>

                <!-- <template if:true={emailsExist}> -->
                    <div class="slds-box">
                        <span style="font-weight: bold;">Emails</span>
                        <div style="height: 175px;">
                            <lightning-datatable 
                                data-id="emailtable"
                                data-field="emailtable" 
                                key-field="Email"
                                data={emails}
                                selected-rows={autoselectedemails}
                                columns={oColumns}>
                            </lightning-datatable>
                        </div>
                    <div class="slds-m-top_medium slds-m-bottom_medium" >
                        <span style="font-weight: bold;">Additional Emails</span>
                        <lightning-textarea variant="label-hidden" data-id="additionalemails"  onchange={handleChange} placeholder="List of additional emails, comma seperated"></lightning-textarea>
                    </div>
                    <span style="font-weight: bold;">Available Attachments</span>
                        <div style="height: 175px;" class="slds-p-bottom_small">
                            <lightning-datatable 
                                data-id="attachmenttable"
                                data-field="attachmenttable" 
                                key-field="Id"
                                data={attachments}
                                selected-rows={autoselectedattachments}
                                columns={oColumnsAttachment}
                                onrowselection={handleAttachmentChange}>
                            </lightning-datatable>
                        </div>
                        Total Attachment Size: {totalAttachmentSizeForDisplay}
                    </div>

                <!-- </template> -->
                
                <template if:false={emailsExist}>
                    <div class="slds-box">
                        <div style="height: 300px;">
                            No Emails exist.
                        </div>
                    </div>
                </template>

                

                <template if:true={error}>
                    <div class="slds-m-top_small">
                        <span style="color:darkred">{error}</span>
                    </div>
                </template>


                </div>  
                <!-- Body Section --> 


                <!-- Footer Section -->  
                <div class="slds-modal__footer">  

                    <template if:true={emailsExist}>
                        
                        <lightning-button class="slds-p-right_small" label="Send Trip Report" variant="brand" onclick={handleSend}></lightning-button>
                        
                    </template>
                    
                    <lightning-button name="closeButton" label="Close" variant="brand" onclick={closeModal}></lightning-button>  

                </div>  
                <!-- Footer Section --> 

            </div>  
            <!-- </div>   -->
        </section>
      </template>  













</template>
